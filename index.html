<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AV At-Scale Readiness Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: a guide-sign header over one working table per domain; the Summary view recalculates from the same state. */
:root{
  --bg:#F3F6F3;--surface:#FFFFFF;--sunken:#E8EDE9;--fg:#17211B;--muted:#526058;--line:#C9D3CC;
  --sign:#0A5C3E;--on-sign:#FFFFFF;--on-sign-soft:#CFE6DB;--accent:#0A6B48;--on-accent:#FFFFFF;
  --amber:#8F4C00;--amber-bg:#FFF0D2;--flash:#F2A900;
  --m1:#B9D2C4;--m1-fg:#17211B;--m2:#2B7F5B;--m2-fg:#FFFFFF;--m3:#0A4F36;--m3-fg:#FFFFFF;
  --f-body:Overpass,"Helvetica Neue",Arial,sans-serif;--f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512;--surface:#18201B;--sunken:#222C26;--fg:#E7EEE9;--muted:#A5B2A9;--line:#36443B;
  --sign:#0B4D35;--on-sign:#FFFFFF;--on-sign-soft:#BFDCCF;--accent:#6AD0A3;--on-accent:#0B1A13;
  --amber:#F4B757;--amber-bg:#3A2A0E;--flash:#F2A900;
  --m1:#3E5448;--m1-fg:#E7EEE9;--m2:#58B28C;--m2-fg:#0B1A13;--m3:#A5E8C8;--m3-fg:#0B1A13;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512;--surface:#18201B;--sunken:#222C26;--fg:#E7EEE9;--muted:#A5B2A9;--line:#36443B;
  --sign:#0B4D35;--on-sign:#FFFFFF;--on-sign-soft:#BFDCCF;--accent:#6AD0A3;--on-accent:#0B1A13;
  --amber:#F4B757;--amber-bg:#3A2A0E;--flash:#F2A900;
  --m1:#3E5448;--m1-fg:#E7EEE9;--m2:#58B28C;--m2-fg:#0B1A13;--m3:#A5E8C8;--m3-fg:#0B1A13;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
.wrap{padding-block:16px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1720px;margin-inline:auto}
.wrap>*{min-width:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Guide sign */
.sign{background:var(--sign);color:var(--on-sign);border-radius:10px;padding:5px}
.sign-in{border:2px solid var(--on-sign);border-radius:7px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.sign-t{min-width:0;flex:1 1 320px}
.sign .eyebrow{font:600 12px var(--f-mono);letter-spacing:.06em;color:var(--on-sign-soft);text-transform:uppercase}
.sign h1{margin:2px 0 0;font-size:clamp(20px,2.6vw,30px);font-weight:800;line-height:1.1;text-wrap:balance}
.sign-s{display:flex;gap:6px;flex-direction:column;align-items:flex-start}
.sign-count{font:800 22px/1 var(--f-body);font-variant-numeric:tabular-nums}
.sign-count small{font-size:13px;font-weight:400;color:var(--on-sign-soft)}
.sign-note{font-size:12px;color:var(--on-sign-soft);max-width:34ch}
.fbk{display:inline-block;margin-top:4px;background:var(--on-sign);color:var(--sign);border-radius:5px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none}
.fbk:hover{text-decoration:underline}
.site-foot{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--muted)}
.site-foot>div{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;min-width:0}
.site-foot img{display:block;height:20px;max-width:100%}
.mail{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.mail .btn{min-height:26px;padding:2px 8px;font-size:12px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;max-width:75ch}
.contact p{margin:0}
.contact ul{margin:0;padding-left:18px;display:grid;gap:4px}
.hear{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:22;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sign);border-radius:8px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:grid;gap:8px}
.hear h2{margin:0;font-size:16px;font-weight:800}
.hear p{margin:0;font-size:13px}
.hear .row a.btn{text-decoration:none;display:inline-flex;align-items:center}

/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px}
.tab{flex:1 0 118px;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);text-decoration:none;min-width:0}
.tab .ltr{grid-row:span 2;width:24px;height:24px;border-radius:4px 4px 0 0;display:grid;place-items:center;background:var(--sunken);font-weight:800}
.tab .nm{font-weight:600;font-size:12.5px;line-height:1.15}
.tab .ct{font:400 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-current="page"]{background:var(--sign);border-color:var(--sign);color:var(--on-sign)}
.tab[aria-current="page"] .ltr{background:var(--on-sign);color:var(--sign)}
.tab[aria-current="page"] .ct{color:var(--on-sign-soft)}

/* Controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.row.split{justify-content:space-between}
.fld{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);min-width:0}
.fld input,.fld select{font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;min-height:32px}
.fld.q{flex:1 1 200px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 10px;min-height:32px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;font-size:11px;margin-right:4px;vertical-align:-3px}
.lv1{background:var(--m1);color:var(--m1-fg)}.lv2{background:var(--m2);color:var(--m2-fg)}.lv3{background:var(--m3);color:var(--m3-fg)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--amber-bg);border:1px solid var(--amber);border-radius:6px}
.confirm span{flex:1 1 240px;color:var(--fg)}
.msg{font-size:13px}

/* Table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:calc(100vh - 150px);min-height:420px}
table.items{border-collapse:separate;border-spacing:0;width:100%;min-width:1340px}
.items th{position:sticky;top:0;z-index:3;background:var(--sunken);text-align:left;font-size:11.5px;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.items td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.items th:first-child,.items td.cid{position:sticky;left:0;background:var(--surface);z-index:2}
.items th:first-child{background:var(--sunken);z-index:4}
.items tr.grp td{background:var(--sunken);font-weight:600;padding:5px 8px;font-size:12.5px}
.items tr.grp td span.mono{margin-right:6px}
.cid{font:600 12px var(--f-mono);white-space:nowrap}
.act{min-width:330px;max-width:430px}
.act p{margin:0 0 6px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:11.5px;color:var(--muted);line-height:1.3;margin:0}
.meta dt{font-weight:600}.meta dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;vertical-align:top}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;width:30px;height:30px;font-weight:600;font-size:13px;border-left:1px solid var(--line);background:var(--bg)}
.seg label:first-child span{border-left:0}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.seg.m input[value="1"]:checked+span{background:var(--m1);color:var(--m1-fg)}
.seg.m input[value="2"]:checked+span{background:var(--m2);color:var(--m2-fg)}
.seg.m input[value="3"]:checked+span{background:var(--m3);color:var(--m3-fg)}
.seg.p input:checked+span{background:var(--fg);color:var(--bg)}
.seg.p .isbase span{text-decoration:underline;text-underline-offset:3px}
.pwrap{display:grid;gap:4px;justify-items:start}
.base{border:0;background:none;padding:0;color:var(--amber);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;min-height:18px;text-align:left}
tr.chg .seg.p{border-color:var(--amber)}
td input.tx,td textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-size:12.5px;display:block}
td textarea{min-height:58px;resize:vertical;line-height:1.35}
td input[type=date]{min-width:124px}
.open{display:inline-block;margin-top:3px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:150px;max-width:190px}
.chip{font:600 11.5px var(--f-mono);display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;text-decoration:none;color:var(--accent);background:var(--bg);line-height:1.3}
.chip:hover{border-color:var(--accent)}
.pip{width:8px;height:8px;border-radius:2px;border:1px solid var(--line);background:transparent}
.pip.v1{background:var(--m1);border-color:var(--m1)}.pip.v2{background:var(--m2);border-color:var(--m2)}.pip.v3{background:var(--m3);border-color:var(--m3)}
.none{color:var(--muted);font-size:12px}
details.inb{margin-top:6px;font-size:11.5px;color:var(--muted)}
details.inb summary{cursor:pointer}
details.inb .chips{margin-top:4px}
tr.flash td{animation:fl 2.2s ease-out}
@keyframes fl{0%,35%{background:var(--amber-bg);box-shadow:inset 0 2px 0 var(--flash),inset 0 -2px 0 var(--flash)}100%{}}
@media (prefers-reduced-motion:reduce){tr.flash td{animation:none;background:var(--amber-bg)}}
.empty{padding:28px;color:var(--muted);text-align:center}

.backpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);border:0;border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--surface);border:1px solid var(--accent);border-radius:7px;padding:8px 12px;display:flex;gap:10px;align-items:center;max-width:min(420px,calc(100vw - 32px));box-shadow:0 3px 12px rgba(0,0,0,.25)}

/* Summary */
.sumgrid{display:grid;gap:16px}
.sumblk h2,.about h2{margin:0 0 6px;font-size:17px;font-weight:800}
.st{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.st table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
.st th{background:var(--sunken);font-size:11.5px;font-weight:600;text-align:right;padding:6px 10px;vertical-align:bottom}
.st td{padding:7px 10px;border-top:1px solid var(--line);text-align:right}
.st th:first-child,.st td:first-child{text-align:left}
.st tr.tot td{font-weight:800;background:var(--sunken)}
.mtr{display:inline-flex;gap:8px;align-items:center;justify-content:flex-end}
.bar{display:inline-block;width:90px;height:8px;background:var(--sunken);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--m2)}
.foot{font-size:12.5px;color:var(--muted);max-width:90ch;margin:0}

/* About */
.about{display:grid;gap:18px}
.about .lede{max-width:75ch}
.about .lede p{margin:0 0 8px}
.fw{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.fw section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.fw h3{margin:0 0 6px;font-size:14px;font-weight:800}
.fw h3 a{color:inherit;text-decoration:none}
.fw h3 a:hover{text-decoration:underline}
.fw ul{margin:0;padding:0;list-style:none;font-size:12.5px;display:grid;gap:3px}
.gl{display:grid;gap:8px;max-width:90ch;margin:0}
.gl dt{font-weight:600}.gl dd{margin:0 0 2px;color:var(--fg)}.gl dd.n{color:var(--muted);font-size:12.5px}

@media (max-width:800px){
  .tw{max-height:none;min-height:0;overflow:visible;border:0;background:none}
  table.items{min-width:0;display:block}
  .items thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .items tbody{display:grid;gap:10px}
  .items tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .items tr.grp{display:block;background:var(--sunken);padding:6px 10px}
  .items tr.grp td{padding:0;background:none;border:0;display:block}
  .items td{display:block;padding:0;border:0;min-width:0}
  .items td.cid{position:static;grid-column:1/-1;background:none}
  .items td.act,.items td.wide{grid-column:1/-1;max-width:none;min-width:0}
  .items td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .seg span{width:38px;height:38px}
  .chips{max-width:none}
  td input[type=date]{min-width:0}
}
</style>
</head>

};

<div class="wrap">

  <footer class="site-foot" id="foot"></footer>
</div>
<button class="backpill" id="back" hidden></button>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const D={"version":"1.0","items":[{"id":"A1-001","dc":"A","sc":"A1","sub":"Governance Authority Map","act":"Maintain an up-to-date authority map that identifies who can permit, restrict, and enforce AV testing and passenger service (city/county/state/regulator), including any state preemption and escalation paths.","own":"City DOT / City Attorney","co":"State DOT; State regulator; MPO","jur":"City/County/State/Regulator","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","G3-004","A5-015"]},{"id":"A1-002","dc":"A","sc":"A1","sub":"Governance Authority Map","act":"Define internal framework that identifies organizational control over AV right-of-way (ROW) actions (e.g., geofences, curb changes, signal timing, work zone constraints) and establish a documented approval/modification process.","own":"City DOT","co":"City Attorney; Police/Fire; Public Works","jur":"City","app":"Streets; Work zones","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A1-001","E1-001"]},{"id":"A2-003","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Establish an interagency AV readiness working group with a regular cadence (e.g., monthly) and documented outputs (issues log, decisions, action tracker). Include routine review of AV‑related incidents and near‑misses using a risk‑based triage approach (e.g., prioritize severe injury risk, repeated patterns, high‑exposure locations, systemic failures). Each agency may manage its own incident collection/storage, but the working group should agree on what rises to interagency review and how actions are tracked to closure.","own":"City Manager / City DOT","co":"Police; Fire/EMS; Public Works; IT; Airport; Other (School Districts; Public Hospital/Medical)","jur":"City/County","app":"Streets; Airports","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["C8-014","D3-004","F2-004","A5-015"]},{"id":"A2-004","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Publish a single point of contact (POC) model for operators and the public (email/phone/311 pathway), including after-hours escalation for urgent issues.","own":"City DOT","co":"311/Customer service; Police/Fire","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A2-003","G3-004","C2-003"]},{"id":"A2-005","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Provide a ‘lightweight’ readiness pathway for small cities/counties (templates, shared regional resources, shared incident response contacts) to avoid a readiness divide.","own":"State DOT / MPO","co":"County; City managers","jur":"State/Regional","app":"Streets","ph":"Service","svc":"Robotaxi","pr":"M","et":"","dep":["A2-003","A2-009","A2-010"]},{"id":"A2-006","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Establish a state–local AV coordination protocol for freeway-adjacent operations: incident response, work zones, ramp closures, and information sharing with Highway Patrol and Traffic Management Centers (TMC).","own":"State DOT / TMC","co":"City DOT; Highway Patrol; MPO","jur":"State/Regional","app":"Freeways; Ramps","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A1-001","A2-010"]},{"id":"A2-007","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Define escalation and coordination for AV operations that transition between city streets and controlled-access facilities (ODD boundaries, shoulder stops, ramp metering, incident staging).","own":"State DOT / City DOT","co":"Highway Patrol; Operators","jur":"Joint","app":"Freeways; Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-006","B7-014","E4-007"]},{"id":"A2-008","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Integrate AV operator briefings into major construction coordination (downtown resurfacing, bridge projects) with advance notice, staging plans, and post-change verification.","own":"Public Works / City DOT","co":"State DOT (if state routes); Operators","jur":"City/State","app":"Work zones","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["A2-003","B2-006"]},{"id":"A2-009","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Coordinate regionally (MPO/COG) to standardize readiness practices and reduce operator burden across multiple jurisdictions (shared standards, templates, and feeds).","own":"MPO / COG","co":"City/County/State DOT","jur":"Regional","app":"Multi-jurisdiction","ph":"Service","svc":"Mixed","pr":"L","et":"","dep":["A2-003","E9-014","F2-004","A2-010"]},{"id":"A2-010","dc":"A","sc":"A2","sub":"Interagency Operating Model","act":"Where needed, execute MOUs/IGAs between city/county/state DOT/regulators for incident management, work zones, and data sharing on state routes and freeways.","own":"State DOT / City Attorney","co":"City DOT; County","jur":"State/City","app":"State routes; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A1-001","A2-006","E1-001","C6-011"]},{"id":"A3-011","dc":"A","sc":"A3","sub":"Regulator Engagement & Proceedings","act":"Create a regulator engagement plan (DMV/CPUC in CA; TxDMV in TX; ADOT/MVD in AZ): routine coordination, comment/filing process, and a mechanism to elevate local operational issues to regulators.","own":"City DOT","co":"City Attorney; State DOT; MPO","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A1-001","A5-015"]},{"id":"A3-012","dc":"A","sc":"A3","sub":"Regulator Engagement & Proceedings","act":"Maintain a local ‘issue dossier’ format and process for escalating safety/operations concerns and performance issues (timeline, location, video if available, 911 CAD references, towing logs) to state/federal regulators, including periodic summaries (e.g., monthly or quarterly).","own":"City DOT","co":"Police/Fire; State regulator","jur":"City/State","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A3-011","C3-006","E4-006","F5-013"]},{"id":"A4-013","dc":"A","sc":"A4","sub":"Policy Alignment, Public Communications, & Community Acceptance","act":"Adopt (or update) a city/state ‘emerging mobility principles’ statement that sets expectations for AV deployment (safety, Vision Zero, transit priority, etc.) and use it to guide regulator comments and operator engagement.","own":"City DOT / City Council","co":"MPO; Transit agency","jur":"City/Regional","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["A1-001","B9-017"]},{"id":"A4-014","dc":"A","sc":"A4","sub":"Policy Alignment, Public Communications, & Community Acceptance","act":"Define accessibility goals for AV passenger service (equivalent service expectations, complaint handling, and progress tracking) and communicate them to regulators and operators.","own":"City DOT / ADA Office","co":"Transit agency; State regulator","jur":"City/State","app":"Streets; Hubs","ph":"Pre-service","svc":"Robotaxi","pr":"M","et":"","dep":["A4-013","A3-011","F3-010","B1-003"]},{"id":"A5-015","dc":"A","sc":"A5","sub":"Risk Management & Liability Posture","act":"Develop a documented risk management posture: insurance benchmarks, claims process, evidence retention, and incident communications protocols coordinated with the city/state risk office.","own":"City Risk Management","co":"City Attorney; City DOT","jur":"City","app":"Streets; Work zones","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A1-001","G3-004"]},{"id":"A5-016","dc":"A","sc":"A5","sub":"Risk Management & Liability Posture","act":"Define a process to communicate temporary operational constraints to operators (e.g., event closures, requested no-stop/no-turn areas), including advance notice and end dates.","own":"City DOT","co":"Police; Public Works; Event permitting","jur":"City","app":"Streets; Special events","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A1-002","A2-003","B2-006","E1-001"]},{"id":"A6-017","dc":"A","sc":"A6","sub":"Documentation & Institutional Memory","act":"Maintain a living ‘AV deployment logbook’ (decisions, incidents, policy changes, operator changes, regulator actions) to support continuity and auditability and share lessons learned with peer jurisdictions.","own":"City DOT","co":"City Manager; State DOT","jur":"City/State","app":"Streets; Freeways","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","G3-004","F5-013"]},{"id":"B1-001","dc":"B","sc":"B1","sub":"Operator Registry & Intake","act":"Maintain a local operator registry (who is operating, what ODD, vehicle type, dispatch/remote assistance model, 24/7 contacts), even where local permitting authority is preempted.","own":"City DOT","co":"State regulator; Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"Other","dep":["A1-001","A2-004"]},{"id":"B1-002","dc":"B","sc":"B1","sub":"Operator Registry & Intake","act":"Review available safety documentation (e.g., VSSA, state permit filings, safety cases) and discuss local operational implications with operators as part of the deployment intake procedure that provides the proposed ODD and Concept of Operations (if applicable).","own":"State regulator (or City DOT where permitted)","co":"Operators; City DOT","jur":"State/City","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A1-001","A3-011","G3-004","A5-015"]},{"id":"B1-003","dc":"B","sc":"B1","sub":"Operator Registry & Intake","act":"Collect standardized information on the operator’s type of service (service profile) and operating concept (passenger vs goods; fleet vs privately owned AV integration; subscription/TNC partnerships), including hours of service, geofence/staging approach, rider eligibility policies, accessibility accommodations, and customer support escalation.","own":"City DOT / State regulator","co":"Operators; Transit agency (if applicable)","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A1-001","A2-003","F2-004","F3-011"]},{"id":"B1-004","dc":"B","sc":"B1","sub":"Operator Registry & Intake","act":"Coordinate with operators on fleet maintenance and lifecycle plan expectations (preventive maintenance, post‑collision inspection, field retrievals), plus depot/staging and EV charging approach (locations, power needs, queueing/traffic impacts, permits). Include who is responsible for towing/repair logistics and how downtime is managed.","own":"City DOT / State DOT","co":"Operators; Public Works; Utility (as applicable)","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A5-015","D9-017"]},{"id":"B2-005","dc":"B","sc":"B2","sub":"ODD & Scaling Change Control","act":"Establish a coordination process with operators for advance notice and briefings on planned ODD expansions and operational changes (target notice window, briefing format).","own":"City DOT","co":"State regulator; Operators; Public Safety","jur":"City/State","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"H","et":"Other","dep":["B1-002","A2-003","F2-005","B3-008"]},{"id":"B2-006","dc":"B","sc":"B2","sub":"ODD & Scaling Change Control","act":"Define a ‘no surprises’ communications protocol for planned deployment changes (ODD expansion, hours, geofences, staging/depot changes, major software releases, new vehicle types) and special operations (events, emergency operations), including designated staging zones and traffic control plans. Propose a target notice window (e.g., ≥14 days for major ODD/scale changes; ≥72 hours for planned operational changes; immediate notification for safety‑critical events), with exceptions for emergencies.","own":"City DOT / Special Events Office","co":"Police; Operators","jur":"City","app":"Streets; Special events","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A2-004","A5-016","B2-005","E1-003"]},{"id":"B3-007","dc":"B","sc":"B3","sub":"Information Sharing & Confidentiality","act":"Establish a data sharing agreement (DSA) or MOU that covers: data fields, cadence, privacy protections, public release rules, and cybersecurity expectations.","own":"City Attorney / City DOT","co":"Operators; IT/Security","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A5-015","E2-004","E3-005","G2-003"]},{"id":"B3-008","dc":"B","sc":"B3","sub":"Information Sharing & Confidentiality","act":"Agree with operators on incident and disruption notification procedures (e.g., stuck vehicle, lane blockage, law enforcement interaction), including target acknowledgment and resolution times.","own":"City DOT","co":"Police/Fire; Operators","jur":"City","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"Other","dep":["A2-004","C3-006"]},{"id":"B4-009","dc":"B","sc":"B4","sub":"Operational Interoperability","act":"Coordinate with operators on access to and ingestion of official city/state feeds for: road closures, work zones, signal outages, and special events.","own":"City DOT / State DOT","co":"IT; Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"Other","dep":["E1-001","E9-014","G5-008"]},{"id":"B4-010","dc":"B","sc":"B4","sub":"Operational Interoperability","act":"Develop a standard process to request operator geofencing / routing adjustments needed for safety operations (work zones, incidents, emergency operations) and confirm with operators when they take effect.","own":"City DOT / State DOT","co":"Operators; Police/Fire","jur":"Joint","app":"Streets; Work zones; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"Other","dep":["A1-002","C2-005","E4-007","E1-001"]},{"id":"B5-011","dc":"B","sc":"B5","sub":"Deployment Monitoring","act":"Implement a city/state monitoring workflow to track: fleet size, ODD boundaries, reported incidents, and recurring hotspots; align monitoring with regulator reporting channels.","own":"City DOT / State DOT","co":"State regulator; Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A2-003","B3-007","F2-004","F5-013"]},{"id":"B6-012","dc":"B","sc":"B6","sub":"Coordination with Transit, Paratransit, Taxi, & TNCs","act":"Coordinate AV service plans with transit agencies and TNC policy to prevent conflict with transit lanes and facilities, and to manage curb access at major hubs.","own":"City DOT","co":"Transit agency; MPO","jur":"City/Regional","app":"Streets; Hubs","ph":"Pre-service","svc":"Mixed","pr":"L","et":"Other","dep":["A2-003","A4-013","E7-012"]},{"id":"B6-013","dc":"B","sc":"B6","sub":"Coordination with Transit, Paratransit, Taxi, & TNCs","act":"Coordinate AV operators with paratransit services to avoid service fragmentation and to explore AV integration pathways.","own":"Transit agency / Paratransit operator","co":"City DOT; MPO; Operators","jur":"Regional","app":"Passenger service","ph":"Service","svc":"Robotaxi","pr":"L","et":"Other","dep":["B6-012","A4-014","F3-011"]},{"id":"B7-014","dc":"B","sc":"B7","sub":"Freeway Transition Readiness","act":"For AV operations that include freeways, coordinate with state DOT, Highway Patrol and operators on operational procedures for shoulder stops, ramp closures, and incident staging compatible with DOT/HP protocols.","own":"State DOT / Highway Patrol","co":"City DOT; Operators","jur":"State","app":"Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"Other","dep":["A2-006","A3-011","E6-009","C6-011"]},{"id":"B8-015","dc":"B","sc":"B8","sub":"Airport Interfaces","act":"For airport service, coordinate curbside operating model with the airport authority (terminal access rules, staging/holding lots, geofenced routes, signage, customer service and enforcement).","own":"Airport Authority / City DOT","co":"Operators; Police","jur":"Airport/City","app":"Airports; Curbs","ph":"Pre-service","svc":"Robotaxi","pr":"H","et":"Other","dep":["A2-007","C7-013","E7-012","B2-006"]},{"id":"B9-016","dc":"B","sc":"B9","sub":"Public Communications","act":"Publish plain-language public information: what AVs are, where to report issues, and how incident information is handled (including limitations), including coordination with operators on public communications after significant incidents.","own":"City DOT / Public Information Office","co":"311; City Manager","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A2-004","B1-001"]},{"id":"B9-017","dc":"B","sc":"B9","sub":"Public Communications","act":"Provide a public-facing complaint pathway for AV curb issues (blocking driveways, unsafe stops) and a workflow to route to operator and regulators.","own":"City DOT / 311","co":"Operators; State regulator","jur":"City/State","app":"Curbs; Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"Other","dep":["A2-004","B3-008","F1-001","F3-010"]},{"id":"C1-001","dc":"C","sc":"C1","sub":"First Responder Training Program","act":"Implement a recurring first responder training program for AV interactions (police, fire, EMS, tow operators) including procedures for immobilization, remote assistance, passenger extraction, and scene control.","own":"Police/Fire/EMS","co":"City DOT; Operators; Highway Patrol","jur":"City/County","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["B1-001","C2-003","G3-005","C5-009"]},{"id":"C1-002","dc":"C","sc":"C1","sub":"First Responder Training Program","act":"Maintain a field-accessible ‘quick reference’ guide (vehicle identification, shutoff points if available, operator hotline, recommended standoff distances) and keep it updated.","own":"Police/Fire/EMS","co":"Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["B1-001","C2-003","G3-005"]},{"id":"C2-003","dc":"C","sc":"C2","sub":"24/7 Emergency Communications","act":"Obtain and maintain each operator’s dedicated 24/7 emergency contact for responders, and test it jointly through periodic drills.","own":"State DOT / City DOT","co":"Operators; Police/Fire","jur":"State/City","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["B1-001","A2-004","G3-004"]},{"id":"C2-004","dc":"C","sc":"C2","sub":"24/7 Emergency Communications","act":"Define dispatch/remote assistance handoff protocols for emergency scenes (who can command the vehicle, response times, documentation).","own":"Police/Fire/EMS","co":"Operators; City DOT","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["B1-001","A1-002","C2-003","E4-007"]},{"id":"C2-005","dc":"C","sc":"C2","sub":"24/7 Emergency Communications","act":"Create a rapid coordination channel for emergency closures (crashes, flooding, police activity) to share geofenced constraints and detours with operators.","own":"State DOT / City DOT","co":"Police/Fire; TMC; Operators","jur":"Joint","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["C2-003","E4-007","B4-010","A2-007","E6-009"]},{"id":"C3-006","dc":"C","sc":"C3","sub":"911/311/TMC Integration","act":"Update 911/311 call-taking and CAD codes to capture AV-related incidents (blocked lanes, stop-in-lane, passenger assistance requests) and route to the correct city team.","own":"911/311 / Emergency Communications","co":"City DOT; Police/Fire","jur":"City/County","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","B1-001","B3-008"]},{"id":"C3-007","dc":"C","sc":"C3","sub":"911/311/TMC Integration","act":"Integrate incident feeds with DOT/TMC incident management systems (for freeway operations), including shared location standards and after-action review (AAR) triggers.","own":"State DOT / TMC","co":"Highway Patrol; City DOT","jur":"State/Regional","app":"Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-006","E1-001","A2-010","E4-007"]},{"id":"C4-008","dc":"C","sc":"C4","sub":"Towing/Clearance & Roadway Recovery","act":"Establish AV-specific towing/clearance procedures (who authorizes tow, how to handle locked/immobilized vehicles, evidence retention), coordinated with operators and tow providers.","own":"Police / Towing & Impound","co":"City DOT; Operators","jur":"City/County","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A5-015","B1-004","C2-004"]},{"id":"C5-009","dc":"C","sc":"C5","sub":"Enforcement & Traffic Law Interactions","act":"Coordinate a standard law enforcement interaction plan (traffic stops, citations, right-of-way control, school zone protocols) and validate with training exercises.","own":"Police / Highway Patrol","co":"City DOT; Operators; State regulator","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A1-001","B1-002","G3-005","C1-001"]},{"id":"C5-010","dc":"C","sc":"C5","sub":"Enforcement & Traffic Law Interactions","act":"Coordinate parking/curb enforcement with AV operations (ticketing, relocation, incident escalation) and confirm enforcement has access to operator contacts and procedures.","own":"Parking enforcement","co":"City DOT; Police; Operators","jur":"City","app":"Curbs","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["C4-008","B3-008","G1-001","E7-012"]},{"id":"C6-011","dc":"C","sc":"C6","sub":"Freeway-Specific Operations","act":"For freeway operations, coordinate with Highway Patrol and operators on how AV operations interface with HP procedures for lane blocks, vehicle retrievals, shoulder use, and incident staging; document agreed procedures and known limitations.","own":"State DOT / Highway Patrol","co":"Operators","jur":"State","app":"Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A2-006","B7-014","A2-010","C2-005"]},{"id":"C6-012","dc":"C","sc":"C6","sub":"Freeway-Specific Operations","act":"For AV freeway operations, share lane closure, dynamic speed limit, and incident management information with operators and record operators’ stated response procedures; coordinate with Highway Patrol.","own":"State DOT / TMC","co":"Highway Patrol; Operators","jur":"State","app":"Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["C6-011","A2-006","B7-014","E6-009"]},{"id":"C7-013","dc":"C","sc":"C7","sub":"Airport-Specific Operations","act":"Align AV airport access with security and emergency response protocols; confirm operator emergency contacts are integrated into airport operations.","own":"Airport Authority","co":"Police/Fire; Operators","jur":"Airport","app":"Airports","ph":"Pre-service","svc":"Robotaxi","pr":"M","et":"","dep":["C1-001","C2-004","B8-015"]},{"id":"C8-014","dc":"C","sc":"C8","sub":"After-Action Review and Learning","act":"Implement an after-action review (AAR) process for significant incidents and recurring near-misses, with corrective actions tracked to closure and shared with regulators where appropriate.","own":"City DOT / Public Safety","co":"State regulator; Operators","jur":"City/State","app":"Streets","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","B3-008","F2-005"]},{"id":"D1-001","dc":"D","sc":"D1","sub":"Road Markings & Signage Quality","act":"Establish a prioritized maintenance plan for lane markings, signs, and delineators on primary AV corridors/deployment areas and near high-risk locations (complex intersections, school zones).","own":"Public Works / City DOT","co":"State DOT (state routes)","jur":"City/State","app":"Streets; State routes","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A1-002","B1-001","D8-015","E1-001"]},{"id":"D1-002","dc":"D","sc":"D1","sub":"Road Markings & Signage Quality","act":"Define an inspection cadence and quality standard (e.g., retroreflectivity/visibility thresholds) and a fast-repair process for deficiencies that affect AV perception and human safety.","own":"Public Works","co":"City DOT","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["D1-001","A1-002","G3-004","G1-001"]},{"id":"D2-003","dc":"D","sc":"D2","sub":"Signal Operations & Detection","act":"Assess signal operations on AV priority corridors (phase timing, detection reliability, signal visibility) and remediate known failure modes (occlusion, unusual phasing).","own":"City DOT / Signal Ops","co":"Public Works; Operators","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["A1-002","B1-001"]},{"id":"D3-004","dc":"D","sc":"D3","sub":"Roadway Geometric Design","act":"Identify and publish known infrastructure constraints that affect AV operations (e.g., complex merges, reversible lanes, transit-only segments) and align with ROW enforcement.","own":"City DOT","co":"Transit agency; Police","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","A1-002","B1-003","E1-001","C5-009"]},{"id":"D4-005","dc":"D","sc":"D4","sub":"Safe Stopping and Pull-Off","act":"Define safe pull-off / staging locations for AV ‘minimal risk condition’ events (especially near freeways, special zones, and dense downtown streets) and coordinate towing/clearance plans.","own":"City DOT / State DOT","co":"Highway Patrol; Operators; Towing","jur":"Joint","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A5-016","B4-009","D7-013","E7-012"]},{"id":"D4-006","dc":"D","sc":"D4","sub":"Safe Stopping and Pull-Off","act":"Designate and manage PUDO zones at high-demand locations (downtown, venues, hospitals), with clear signage/markings and digital rules to support AV routing and safe stops.","own":"City DOT / Parking management","co":"Public Works; Operators","jur":"City","app":"Curbs; Hubs","ph":"Pre-service","svc":"Robotaxi","pr":"M","et":"","dep":["A5-016","B4-009","D7-013","E7-012"]},{"id":"D4-007","dc":"D","sc":"D4","sub":"Safe Stopping and Pull-Off","act":"Identify and mitigate high-risk interaction zones (shared streets, school zones, dense micromobility) through infrastructure changes and operating guidelines to minimize conflicts between AV and VRUs.","own":"City DOT","co":"Schools; Public Works; Operators","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["D7-013","D8-015","A4-013","B2-005","F2-004"]},{"id":"D4-008","dc":"D","sc":"D4","sub":"Safe Stopping and Pull-Off","act":"Define curb and loading guidelines for delivery/low-speed AVs (if present), including designated operating areas and curb usage guidelines.","own":"City DOT","co":"Public Works; Operators","jur":"City","app":"Curbs; Streets","ph":"Service","svc":"Delivery","pr":"L","et":"","dep":[]},{"id":"D5-009","dc":"D","sc":"D5","sub":"Temporary Traffic Control Standards","act":"Confirm traffic control plans include AV considerations: clear lane guidance, predictable channelization, and avoidance of ambiguous markings; document contractor expectations.","own":"State DOT / City DOT","co":"Contractors","jur":"State/City","app":"Work zones","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["D1-001","D6-011","A1-002","E6-009"]},{"id":"D5-010","dc":"D","sc":"D5","sub":"Temporary Traffic Control Standards","act":"Implement a post-closure verification process to confirm the digital feed and physical field conditions are consistent (prevent ghost closures / stale restrictions).","own":"State DOT / City DOT","co":"Contractors; TMC","jur":"State/City","app":"Work zones","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["E6-009","E6-010"]},{"id":"D6-011","dc":"D","sc":"D6","sub":"Freeway Physical Infrastructure Readiness","act":"For freeway operations, confirm work zone configurations, signage, lane shifts, and ramp closures align with standards and are distributed digitally to support AV routing and safety.","own":"State DOT","co":"Contractors; Highway Patrol","jur":"State","app":"Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-006","E1-001","B7-014","E6-009","C6-011"]},{"id":"D7-012","dc":"D","sc":"D7","sub":"Accessibility of Physical Infrastructure","act":"Establish loading guidelines and enforcement approach (if applicable) for busy corridors (designated zones; avoiding stops in travel lanes), coordinate with operators on their use.","own":"City DOT / Parking enforcement","co":"Police; Operators","jur":"City","app":"Curbs; Streets","ph":"Pre-service","svc":"Robotaxi","pr":"M","et":"","dep":[]},{"id":"D7-013","dc":"D","sc":"D7","sub":"Accessibility of Physical Infrastructure","act":"Confirm AV PUDO and access routes support safe and accessible interactions for all users, such as curb ramps, detectable edges, and unobstructed pedestrian pathways, especially at mobility hubs where AV demand concentrates.","own":"City DOT / ADA Office","co":"Transit agency; Public Works","jur":"City","app":"Hubs; Curbs","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A4-013","E7-012","C5-010"]},{"id":"D7-014","dc":"D","sc":"D7","sub":"Accessibility of Physical Infrastructure","act":"Verify PUDO zones and curb rules preserve accessible paths of travel (no blocking ramps/sidewalks), with enforcement and coordination with operators on corrective actions.","own":"City DOT / ADA Office","co":"Parking enforcement; Operators","jur":"City","app":"Curbs","ph":"Pre-service","svc":"Robotaxi","pr":"H","et":"","dep":["D4-006","D7-013","C5-010","E7-012"]},{"id":"D8-015","dc":"D","sc":"D8","sub":"Audit and Continuous Improvement","act":"Use AV incident hotspot analysis to prioritize infrastructure fixes (signage, markings, curb design) and document before/after outcomes.","own":"City DOT","co":"Public Works; Operators","jur":"City","app":"Streets","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","B3-008","F2-004","C8-014"]},{"id":"D8-016","dc":"D","sc":"D8","sub":"Audit and Continuous Improvement","act":"Pilot design interventions at recurring AV friction points (mid-block stopping, high curb demand) and document outcomes to inform standards.","own":"City DOT","co":"Public Works; Operators; MPO","jur":"City","app":"Curbs; Hubs","ph":"Service","svc":"Mixed","pr":"L","et":"","dep":["A5-016","D8-015","G4-007","F1-003"]},{"id":"D9-017","dc":"D","sc":"D9","sub":"Energy & Charging Infrastructure","act":"Assess EV charging capacity and siting impacts for AV fleet depots/staging (electrical service capacity, permitting, neighborhood traffic, queuing/spillback, safety). Coordinate with utilities and land‑use agencies; document constraints and desired upgrades before scale.","own":"City/County Public Works","co":"Utility; Planning/Zoning; Operators","jur":"City/County","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["B1-004","G1-002","A1-002","G1-001"]},{"id":"D9-018","dc":"D","sc":"D9","sub":"Energy & Charging Infrastructure","act":"Define guidelines and safety considerations for any curbside/public‑right‑of‑way charging that interacts with AV operations (ADA clearance, cable management, fire safety, time limits, enforcement). Confirm charging does not create new curb conflicts with transit, micromobility, or emergency access.","own":"City DOT / Public Works","co":"Fire Marshal; Utility; Parking enforcement","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["D9-017","A1-002","E7-012","C5-009"]},{"id":"E1-001","dc":"E","sc":"E1","sub":"Authoritative Digital Feeds","act":"Publish and maintain authoritative machine-readable feeds for: road closures, restrictions, curb rules, and (where feasible) signal status/outages and planned signal maintenance notifications for operator ingestion; designate system owners and update cadence.","own":"City DOT / State DOT","co":"IT/GIS; Public Works","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A1-002","E9-014","G5-008","G2-003"]},{"id":"E1-002","dc":"E","sc":"E1","sub":"Authoritative Digital Feeds","act":"Maintain a ‘source of truth’ registry (URLs/endpoints, schemas, contact owners) for operators and internal teams.","own":"City DOT / State DOT","co":"IT","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["E1-001","A2-004","G3-004","G5-008"]},{"id":"E1-003","dc":"E","sc":"E1","sub":"Authoritative Digital Feeds","act":"Maintain a machine-readable feed for special events / planned closures (parades, marathons, filming) and align with operator change-control procedures.","own":"City DOT / Special Events Office","co":"Police; Event permitting; Operators","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A5-016","E1-001","B2-005","B2-006"]},{"id":"E2-004","dc":"E","sc":"E2","sub":"Data Governance & Privacy","act":"Adopt data governance for AV-related data exchanges: privacy classification, retention, public disclosure rules, and de-identification expectations.","own":"City Attorney / IT Governance","co":"City DOT; Operators","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A5-015","A3-011","B3-007","F5-013"]},{"id":"E3-005","dc":"E","sc":"E3","sub":"Cybersecurity & Resilience","act":"Define cybersecurity expectations for AV-related data interfaces (authentication, logging, rate limiting, incident response) consistent with city/state IT security policies.","own":"City/State IT Security","co":"City DOT; Operators","jur":"City/State","app":"Digital interfaces","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A5-015","G2-003","G5-008","E9-014"]},{"id":"E4-006","dc":"E","sc":"E4","sub":"Two-Way Data Exchange with Operators","act":"Identify data the city/state would like to receive (hotspots, service volumes by zone/time, disruption alerts) and agree on format/cadence.","own":"City DOT / State DOT","co":"Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","B3-007","F2-004"]},{"id":"E4-007","dc":"E","sc":"E4","sub":"Two-Way Data Exchange with Operators","act":"Establish a secure channel for real-time operational coordination during incidents (shared map layer, closure polygons, staging zones).","own":"City DOT / State DOT","co":"TMC; Police/Fire; Operators","jur":"Joint","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["C2-003","E3-005","B4-010","A2-007"]},{"id":"E5-008","dc":"E","sc":"E5","sub":"Mapping & Asset Updates","act":"Implement a process to keep critical asset changes current and shareable (new turn restrictions, curb changes, signal timing changes), with an internal owner and QA checks.","own":"City DOT / Public Works","co":"IT/GIS","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":[]},{"id":"E6-009","dc":"E","sc":"E6","sub":"Work Zone Data Exchange & Temporary Traffic Control Data","act":"Publish work zone and lane closure data using WZDx or an equivalent machine-readable standard and coordinate with operators on reliable feed consumption.","own":"State DOT / City DOT (as applicable)","co":"Contractors; IT; Operators","jur":"State/City","app":"Freeways; Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":[]},{"id":"E6-010","dc":"E","sc":"E6","sub":"Work Zone Data Exchange & Temporary Traffic Control Data","act":"Define internal performance targets for work zone data publishing (how quickly new closures, lane shifts, and end times are reflected) and a QA process to prevent stale/inaccurate data.","own":"State DOT / City DOT","co":"Contractors; TMC","jur":"State/City","app":"Freeways; Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":[]},{"id":"E6-011","dc":"E","sc":"E6","sub":"Work Zone Data Exchange & Temporary Traffic Control Data","act":"Standardize and publish key temporary traffic control attributes (closed lanes, taper length, detour routes, speed limits) needed by ADS and traveler information systems.","own":"State DOT / City DOT","co":"Contractors; IT/GIS","jur":"State/City","app":"Work zones","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":[]},{"id":"E7-012","dc":"E","sc":"E7","sub":"Digital Curb Inventory & Policy","act":"Maintain a static and dynamic digital curb inventory (rules by segment/time, designated PUDO zones) that can be shared with operators and enforcement","own":"City DOT / Curb Management Team","co":"Parking enforcement; IT/GIS","jur":"City","app":"Curbs; Hubs","ph":"Pre-service","svc":"Robotaxi","pr":"M","et":"","dep":["A1-002","D4-006","E9-014","G5-008","C5-010"]},{"id":"E8-013","dc":"E","sc":"E8","sub":"Integration with Traveler Information","act":"Align AV-relevant digital feeds with 511 / traveler information systems, TMC and mobility service platform workflows to avoid conflicting public messaging and provide integrated services.","own":"State DOT / TMC","co":"City DOT; MPO","jur":"State/Regional","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["E1-001","A2-006","C3-007"]},{"id":"E9-014","dc":"E","sc":"E9","sub":"Standards Posture","act":"Adopt a digital standards and interoperability posture for machine-readable roadway data (e.g., WZDx for work zones; consider MDS/CDS for curb/device data where applicable) and document how this posture is applied in procurement, data publishing, and operator interfaces.","own":"City/State DOT","co":"IT/Procurement","jur":"City/State","app":"Digital","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A2-003","G2-003","G5-008"]},{"id":"F1-001","dc":"F","sc":"F1","sub":"Incident & Safety Reporting","act":"Publish a public-facing incident log/dashboard (with clear disclaimers) and update cadence; include standardized categories and routing for follow-up. The dashboard can inform interagency discussions and show cumulative metrics by update cadence period (e.g., monthly, quarterly).","own":"City DOT","co":"311/911; Police/Fire","jur":"City","app":"Streets","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","C3-006","B3-008","F5-013","A5-015"]},{"id":"F1-002","dc":"F","sc":"F1","sub":"Incident & Safety Reporting","act":"Cross-reference local incident tracking with publicly available federal crash reporting data (NHTSA ADS crash reporting) and state regulator data where available.","own":"City DOT / State regulator","co":"Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A3-011","B3-007","F5-013","C8-014"]},{"id":"F1-003","dc":"F","sc":"F1","sub":"Incident & Safety Reporting","act":"Conduct after-action reviews for significant AV-related traffic control events (e.g., repeated disengagements, lane-blocking) and update contractor standards and data workflows accordingly.","own":"State DOT / City DOT","co":"Contractors; Operators; Public Safety","jur":"State/City","app":"Work zones","ph":"Service","svc":"Mixed","pr":"H","et":"","dep":["C8-014","F4-012","G4-007","A2-003","E6-010"]},{"id":"F2-004","dc":"F","sc":"F2","sub":"Performance Metrics Framework","act":"Define a *tiered* performance metrics framework for pre-service and service operations. A baseline set may include: (a) safety/incident metrics (b) *exposure and mobility service* metrics (c) curb/operations metrics (dwell time, pickup/drop‑off conflicts); and (d) congestion indicators where feasible. Specify definitions, privacy thresholds, reporting cadence, and responsible parties for each phase. Data fields characterizing events may follow typical human crash descriptors (e.g., lighting conditions, road surface, weather, etc.)","own":"City DOT / State DOT","co":"Police/Fire; Operators","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A4-013","B3-007","B5-011","F2-009"]},{"id":"F2-005","dc":"F","sc":"F2","sub":"Performance Metrics Framework","act":"Agree with operators on phase‑based reporting cadences (e.g., Pre-service: monthly; Service: monthly/quarterly) and escalation triggers (e.g., repeated lane‑blocking hotspots, response times exceeding targets).","own":"City DOT / State regulator","co":"Operators; Public Safety","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["A2-003","B2-005","F2-004"]},{"id":"F2-006","dc":"F","sc":"F2","sub":"Performance Metrics Framework","act":"Monitor uptime and latency for critical digital feeds; define remediation processes and service-level targets for internal systems supporting AV coordination.","own":"City/State IT","co":"City/State DOT","jur":"City/State","app":"Digital","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["E1-001","G5-008","G3-004"]},{"id":"F2-007","dc":"F","sc":"F2","sub":"Performance Metrics Framework","act":"Assess service coverage distribution, track geographic availability over time, and share findings.","own":"City DOT / MPO","co":"Operators; Transit agency","jur":"City/Regional","app":"Passenger service","ph":"Pre-service","svc":"Robotaxi","pr":"L","et":"","dep":["F2-004","F2-008","B2-005","A4-013"]},{"id":"F2-008","dc":"F","sc":"F2","sub":"Performance Metrics Framework","act":"Define and publish aggregated exposure reporting (VMT, trips, passenger‑miles if available, average trip length, time‑of‑day distribution) at an appropriate geographic aggregation that supports congestion monitoring while protecting privacy. Include definitions and baseline sample thresholds.","own":"City DOT / State DOT","co":"Operators; MPO/Regional planning (optional)","jur":"City/State","app":"Streets; Freeways","ph":"Service","svc":"Mixed","pr":"L","et":"","dep":["B1-003","B3-007","F2-004","F5-013"]},{"id":"F2-009","dc":"F","sc":"F2","sub":"Performance Metrics Framework","act":"Agree with operators on ‘stuck vehicle’ response time targets (minutes to remote resolution vs tow) and incorporate into incident management KPIs.","own":"City DOT / Police","co":"Operators","jur":"City","app":"Streets","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["B3-008","C4-008","F2-004"]},{"id":"F3-010","dc":"F","sc":"F3","sub":"Public Trust Indicators","act":"Track and report public trust indicators (complaint volume, sentiment themes, equity concerns) and incorporate into operational adjustments.","own":"City DOT / City Manager","co":"PIO; Community orgs","jur":"City","app":"Streets","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["F1-001","A4-013","B9-017"]},{"id":"F3-011","dc":"F","sc":"F3","sub":"Public Trust Indicators","act":"Track and report accessibility KPIs (response time for assistance requests, complaint resolution time, accessible vehicle availability where applicable).","own":"City DOT / Transit agency","co":"Operators; State regulator","jur":"City/State","app":"Passenger service","ph":"Service","svc":"Robotaxi","pr":"M","et":"","dep":["F2-004","F5-013","B3-008","A3-012"]},{"id":"F4-012","dc":"F","sc":"F4","sub":"Audits & Independent Evaluation","act":"Commission periodic independent evaluations of AV impacts (safety, congestion, curb operations) and publish findings; use results to update policy.","own":"City DOT / MPO","co":"Academic partners","jur":"City/Regional","app":"Streets","ph":"Service","svc":"Mixed","pr":"L","et":"","dep":["A2-003","F2-004","G2-003","E9-014"]},{"id":"F5-013","dc":"F","sc":"F5","sub":"Data Quality & Provenance","act":"Document provenance and limitations of all published AV performance data (reporting bias, validation status) and maintain an internal QA checklist.","own":"City DOT / IT","co":"Operators","jur":"City","app":"Data","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["E2-004","B3-007","A5-015"]},{"id":"G1-001","dc":"G","sc":"G1","sub":"Funding","act":"Identify sustainable funding for readiness activities (staffing, data systems, training, work‑zone publishing, incident response) and define fee/revenue models where legally allowed and aligned with procurement rules. Include options such as (if applicable): permitting/administrative fees; curb/parking and staging fees; cost recovery for incidents, service disruptions, incident response/towing; and incentive/discount structures that encourage coordination with public transit and shared mobility.","own":"City/State DOT Finance","co":"Procurement; City Manager","jur":"City/State","app":"All","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A5-015"]},{"id":"G1-002","dc":"G","sc":"G1","sub":"Funding","act":"Plan and fund EV charging and energy infrastructure needed for AV fleets and supporting municipal assets (grid/utility coordination, depot permitting, resilience/backup power for critical operations). Coordinate with city/state electrification programs to avoid duplicative investments.","own":"City/State DOT","co":"Utility; Operators; Public Works","jur":"City/State","app":"Streets; Freeways","ph":"Pre-service","svc":"Mixed","pr":"L","et":"","dep":["D9-017","B1-004","A1-002","G1-001"]},{"id":"G2-003","dc":"G","sc":"G2","sub":"Procurement & Contracting for Public Sector AV Services","act":"Develop procurement templates for AV-related services (data platforms, digital feeds, evaluation contracts) including cybersecurity and privacy clauses.","own":"Procurement / City Attorney","co":"IT Security; City DOT","jur":"City/State","app":"Digital","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["E9-014","A5-015","F5-013","A2-003","E3-005"]},{"id":"G3-004","dc":"G","sc":"G3","sub":"Staffing, Training & Workforce Development","act":"Define core roles and baseline staffing (policy lead, operations coordinator, data and analytics lead, data systems/IT lead; public safety liaison; legal/risk management liaison) and plan for back-up coverage.","own":"City DOT / City Manager","co":"HR; Public Safety","jur":"City/State","app":"All","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["A2-003","A2-004","G1-001"]},{"id":"G3-005","dc":"G","sc":"G3","sub":"Staffing, Training & Workforce Development","act":"Budget and plan for recurring training: first responders, dispatchers, traffic ops, work zone contractors, and public communications staff.","own":"City/State DOT","co":"Police/Fire; HR","jur":"City/State","app":"All","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["C1-001","C5-009","B1-002","G3-004"]},{"id":"G3-006","dc":"G","sc":"G3","sub":"Staffing, Training & Workforce Development","act":"Budget and plan for recurring training: data literacy for AV performance metrics, incident analysis workflows, and legal/risk considerations relevant to AV operations.","own":"City/State DOT","co":"HR; Public Safety","jur":"City/State","app":"All","ph":"Pre-service","svc":"Mixed","pr":"M","et":"","dep":["F2-004","C8-014","A5-015","G1-001"]},{"id":"G4-007","dc":"G","sc":"G4","sub":"Sustainment & Continuous Improvement","act":"Establish an annual readiness review cycle: update checklist levels, refresh policies, review incidents/AARs, and update digital feeds and standards posture.","own":"City/State DOT","co":"MPO; Public Safety; Operators","jur":"City/State","app":"All","ph":"Service","svc":"Mixed","pr":"M","et":"","dep":["F2-004","C8-014","D8-015","E9-014"]},{"id":"G5-008","dc":"G","sc":"G5","sub":"Technology Sustainment","act":"Plan for lifecycle costs of digital infrastructure supporting AV coordination (feed hosting, monitoring, security patching, data storage) and assign system owners.","own":"City/State IT","co":"City/State DOT","jur":"City/State","app":"Digital","ph":"Pre-service","svc":"Mixed","pr":"H","et":"","dep":["E1-001","E9-014","F5-013","G1-001","E3-005"]}],"domains":[{"code":"A","tab":"A_Governance","name":"Governance & Authority"},{"code":"B","tab":"B_Operator_Intake","name":"Operator Intake, Permitting & Deployment Management"},{"code":"C","tab":"C_Public_Safety","name":"Public Safety Operations"},{"code":"D","tab":"D_Physical_Infrastructure","name":"Physical Infrastructure Readiness"},{"code":"E","tab":"E_Digital_Data","name":"Digital Infrastructure & Data Exchange"},{"code":"F","tab":"F_Metrics_Transparency","name":"Performance Measurement & Transparency"},{"code":"G","tab":"G_Funding_Workforce","name":"Funding, Procurement & Workforce Capacity"}],"readme":["AV At-Scale Deployment Readiness Checklist (v1.0)","Updated: 2026-11-03","How to use:","1) Use domain tabs A–G to assess readiness for at-scale AV deployment on streets and freeways. Mark each item 1-3; see Summary Sheet for results.","2) For each item, assign a Maturity level: Not Implemented (1); Partially Implemented/Only as Needed (2); Fully Implemented/Institutionalized (3).","3) Review the Summary tab for domain and overall readiness summaries.","Scope note:","This checklist is primarily oriented to commercially operated AV fleets (robotaxi, delivery, shuttles) because these are the dominant near-term at-scale deployment models. Many items also apply to other modalities and privately owned automated vehicles operating in mixed traffic; adapt intake/permitting items as appropriate.","The checklist is intended as a planning and self-assessment tool, not as strict requirements, a compliance audit, or a pass-fail scoring mechanism. It is designed to help agencies identify readiness gaps, prioritize near-term actions, and support coordinated decision-making as AV activity evolves"],"glossary":[["Response time / performance targets","Explicit, measurable performance goals (e.g., acknowledgment time, response time, resolution time) agreed between parties or set within an agency.","Used in place of “service-level agreement (SLA)”. Applies to incident response, work-zone publishing, and operator coordination."],["ODD","Operational Design Domain: the specific conditions under which an AV is designed to operate (geography, roadway types, speed, weather, time-of-day, etc.).","ODD expansions can trigger change-control and ‘no surprises’ communication."],["MRC","Minimal Risk Condition: a safe state the vehicle can reach when encountering a fault or when the automated system disengages.","Important for incident management and responder protocols."],["Service model applicability","Primary AV service model the checklist item is most relevant to. Use one of: Robotaxi, Delivery, Shuttle, Private AV, or Mixed (cross-cutting / applies broadly across multiple service models).",""],["CAD","Computer-Aided Dispatch",""],["MOU","Memorandum of Understanding",""],["IGA","Intergovernmental Agreement",""],["Operator","Entity responsible for AV fleet operations in a deployment; may differ from the ADS developer/OEM or the booking platform (e.g., TNC partner).",""]],"framework":[["A. Governance & Authority","D. Physical Infrastructure Readiness","G. Funding, Procurement, & Workforce Capacity",""],["A1. Governance Authority Map","D1. Road Markings & Signage Quality","G1. Funding",""],["A2. Interagency Operating Model","D2. Signal Operations & Detection","G2. Procurement & Contracting for Public Sector AV Services",""],["A3. Regulator Engagement & Proceedings","D3. Roadway Geometric Design","G3. Staffing, Training & Workforce Development",""],["A4. Policy Alignment, Public Communications, & Community Acceptance","D4. Safe Stopping and Pull-Off","G4. Sustainment & Continuous Improvement",""],["A5. Risk Management & Liability Posture","D5. Temporary Traffic Control Standards","G5. Technology Sustainment",""],["A6. Documentation & Institutional Memory","D6. Freeway Physical Infrastructure Readiness","",""],["","D7. Accessibility of Physical Infrastructure","",""],["B. Operator Intake, Permitting, and Deployment Management","D8. Audit and Continuous Improvement","",""],["B1. Operator Registry & Intake","D9. Energy & Charging Infrastructure","",""],["B2. ODD & Scaling Change Control","","",""],["B3. Information Sharing & Confidentiality","E. Digital Infrastructure & Data Exchange","",""],["B4. Operational Interoperability","E1. Authoritative Digital Feeds","",""],["B5. Deployment Monitoring","E2. Data Governance & Privacy","",""],["B6. Coordination with Transit, Paratransit, Taxi, & TNCs","E3. Cybersecurity & Resilience","",""],["B7. Freeway Transition Readiness","E4. Two-Way Data Exchange with Operators","",""],["B8. Airport Interfaces","E5. Mapping & Asset Updates","",""],["B9. Public Communications","E6. Work Zone Data Exchange & Temporary Traffic Control Data","",""],["","E7. Digital Curb Inventory & Policy","",""],["C. Public Safety Operations","E8. Integration with Traveler Information","",""],["C1. First Responder Training Program","E9. Standards Posture","",""],["C2. 24/7 Emergency Communications","","",""],["C3. 911/311/TMC Integration","F. Performance Measurement & Transparency","",""],["C4. Towing/Clearance & Roadway Recovery","F1. Incident & Safety Reporting","",""],["C5. Enforcement & Traffic Law Interactions","F2. Performance Metrics Framework","",""],["C6. Freeway-Specific Operations","F3. Public Trust Indicators","",""],["C7. Airport-Specific Operations","F4. Audits & Independent Evaluation","",""],["C8. After-Action Review and Learning","F5. Data Quality & Provenance","",""]]};

function clean(o){const st=blank();let skipped=0,kept=0;
  const put=(f,id,v)=>{if(!byId[id]){skipped++;return}st[f][id]=v;kept++};
  for(const[id,v]of Object.entries(o.m||{})){const n=Number(v);if([1,2,3].includes(n))put('m',id,n);else skipped++}
  for(const[id,v]of Object.entries(o.p||{})){if(['H','M','L'].includes(v)){if(byId[id]&&byId[id].pr===v)continue;put('p',id,v)}else skipped++}
  for(const f of['ev','note'])for(const[id,v]of Object.entries(o[f]||{})){if(typeof v==='string'&&v)put(f,id,v.slice(0,5000));else if(v)skipped++}
  for(const f of['td','lr'])for(const[id,v]of Object.entries(o[f]||{})){if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v))put(f,id,v);else if(v)skipped++}

function visible(i){
  if(F.q){const q=F.q.toLowerCase();if(![i.id,i.act,i.own,i.co,i.sub,S.note[i.id]||'',S.ev[i.id]||''].join(' ').toLowerCase().includes(q))return false}
  else if(i.dc!==view)return false;
  if(F.ph&&i.ph!==F.ph)return false;
  if(F.pr&&prio(i)!==F.pr)return false;
  if(F.st==='open'&&S.m[i.id])return false;
  if(F.st==='done'&&!S.m[i.id])return false;
  if(F.st==='chg'&&!S.p[i.id])return false;
  return true}

async function saveFile(name,data,mime){

    if(dl){try{await dl.save({filename:name,data});toast('Saved '+name+'.')}catch(e){if(e&&e.code!=='declined')toast('The file could not be saved here: '+(e.message||e.code||'unavailable')+'.')}return}
    toast('File saving is not available in this view.');return}
  const u=URL.createObjectURL(new Blob([data],{type:mime}));const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Saved '+name+'.')}

  const q=(v,user)=>{let s=v==null?'':String(v);if(user&&/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const head=['ID','Domain Code','Domain','Subdomain Code','Subdomain','Activity','Primary Owner','Co-Owners','Jurisdiction Level','Applicability','Phase','Service model applicability','Maturity (1-3)','Priority (H/M/L)','Base Priority','Evidence Type','Evidence / Link','Status Notes','Dependencies','Target Date','Last Reviewed'];
  const lines=[head.map(x=>q(x)).join(',')];
  D.items.forEach(i=>{const dn=D.domains.find(d=>d.code===i.dc).name;
    lines.push([q(i.id),q(i.dc),q(dn),q(i.sc),q(i.sub),q(i.act),q(i.own),q(i.co),q(i.jur),q(i.app),q(i.ph),q(i.svc),q(S.m[i.id]||''),q(prio(i)),q(i.pr),q(i.et),q(S.ev[i.id]||'',1),q(S.note[i.id]||'',1),q(i.dep.join('; ')),q(S.td[i.id]||''),q(S.lr[i.id]||'')].join(','))});
  saveFile(FILE_BASE+'.csv','﻿'+lines.join('\r\n'),'text/csv')}
$('imp').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(x){toast('That file is not a progress file saved from this page.');return}
    if(!o||typeof o!=='object'||!FIELDS.some(k=>o[k])){toast('That file is not a progress file saved from this page.');return}
    const prev=JSON.stringify(S),c=clean(o);S=c.state;save();rerender();
    let msg='Loaded '+c.kept+' entries.';if(c.skipped)msg+=' Skipped '+c.skipped+' that did not match this version.';
    if(o.version&&o.version!==D.version)msg+=' File is v'+o.version+', page is v'+D.version+': check renumbered items.';
    toast(msg,prev)};
  rd.onerror=()=>toast('That file could not be read.');rd.readAsText(f)});

$('eyebrow').textContent='v'+D.version+' · '+D.readme[1];
load();buildTabs();save();
initSite();
const start=location.hash.slice(1);curHash=start||null;route(start||'A');
maybeHear();
</script>
